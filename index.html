<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Интерактивни приказ метеоролошких ризика</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="css/app.css?v=calendar-months-20260827-1">

<style>
/* MeteoRisk mobile timeline refinement */
.time-info {
    min-width: 0;
}
#valid-time-label,
#lead-time-label {
    min-width: 0;
}
#lead-time-label {
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: right;
}
@media (max-width: 700px) {
    .timeline-main {
        width: 100%;
        box-sizing: border-box;
    }
    .time-slider-wrapper {
        min-width: 0;
        flex: 1 1 auto;
    }
    .time-info {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
        gap: 6px;
        align-items: start;
        width: 100%;
        box-sizing: border-box;
        font-size: 11px;
        line-height: 1.2;
    }
    #valid-time-label {
        text-align: left;
    }
    #lead-time-label {
        text-align: right;
        max-width: 100%;
    }
}
@media (max-width: 430px) {
    .time-info {
        grid-template-columns: 1fr;
        gap: 2px;
    }
    #lead-time-label {
        text-align: left;
    }
}
</style>

</head>

<body>

<!-- METEORISK M1 APP LOADER -->
<div id="app-loading-overlay" class="app-loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="app-loading-card">
        <div class="app-loading-brand">MeteoRisk</div>
        <div class="app-loading-spinner" aria-hidden="true"></div>
        <div id="app-loading-text" class="app-loading-text">Учитавање најновијих података…</div>
        <div class="app-loading-subtext">Карта · ризици · временска линија</div>
    </div>
</div>

<div class="header">

    <div class="language-switch">

        <button
            class="lang-button active"
            data-lang="sr">
            SR
        </button>

        <button
            class="lang-button"
            data-lang="en">
            EN
        </button>

    </div>

    <div
        class="meteorisk-signature"
        aria-label="Slobodan Sovilj">
        Slobodan Sovilj
    </div>

    <h1 id="main-title"></h1>

    <div
        class="subtitle"
        id="subtitle">
    </div>

    <div
        class="update-info"
        id="update-info">
    </div>

</div>


<div class="toolbar">

    <div class="search-wrapper">

        <input
            type="text"
            id="municipality-search"
            autocomplete="off"
        >

        <button
            id="search-button"
            type="button">
            🔎
        </button>

        <div
            id="search-results"
            class="search-results">
        </div>

    </div>

    <button
        class="action-button"
        id="location-button"
        type="button">
    </button>

    <button
        class="action-button"
        id="pdf-button"
        type="button">
    </button>

    <button
        class="action-button"
        id="share-button"
        type="button">
    </button>

</div>


<div class="controls">

    <div class="hazard-group-tabs">
        <button
            class="hazard-group-button single-module"
            id="storm-group-button"
            type="button">
            <span id="storm-group-label">⛈ ОЛУЈА</span>
        </button>

        <button
            class="hazard-group-button"
            id="wind-group-button"
            type="button">
            <span id="wind-group-label">💨 ВЕТАР</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button"
            id="temperature-group-button"
            type="button">
            <span id="temperature-group-label">🌡 ТЕМПЕРАТУРА</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button"
            id="fire-group-button"
            type="button">
            <span id="fire-group-label">🔥 ПОЖАРИ</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button"
            id="air-quality-group-button"
            type="button">
            <span id="air-quality-group-label">🌫 КВАЛИТЕТ ВАЗДУХА</span>
            <span class="arrow">▼</span>
        </button>

        <button
            class="hazard-group-button single-module"
            id="uv-group-button"
            type="button">
            <span id="uv-group-label">☀️ UV ИНДЕКС</span>
        </button>
    </div>

    <div class="hazard-subcontrols" id="storm-subcontrols" hidden>

        <button
            class="layer-button"
            data-layer="thunder"
            id="btn-thunder">
        </button>

        <button
            class="layer-button"
            data-layer="hail"
            id="btn-hail">
        </button>

        <button
            class="layer-button"
            data-layer="large_hail"
            id="btn-large-hail">
        </button>

        <button
            class="layer-button"
            data-layer="very_large_hail"
            id="btn-very-large-hail">
        </button>

    </div>

    <div class="hazard-subcontrols" id="wind-subcontrols">
        <button class="layer-button" data-layer="wind_risk_level" id="btn-wind-risk"></button>
    </div>

    <div class="hazard-subcontrols" id="temperature-subcontrols">
        <button
            class="layer-button"
            data-layer="max_temperature"
            id="btn-max-temperature">
        </button>
        <button
            class="layer-button"
            data-layer="heat_stress"
            id="btn-heat-stress">
        </button>
    </div>

    <div class="hazard-subcontrols" id="fire-subcontrols">
        <button class="layer-button" data-layer="fire_fwi" id="btn-fire-fwi"></button>
        <button class="layer-button" data-layer="fire_hdw" id="btn-fire-hdw"></button>
    </div>

    <div class="hazard-subcontrols" id="air-quality-subcontrols">
        <button class="layer-button" data-layer="air_pm25" id="btn-air-pm25"></button>
        <button class="layer-button" data-layer="air_pm10" id="btn-air-pm10"></button>
        <button class="layer-button" data-layer="air_o3" id="btn-air-o3"></button>
    </div>

</div>


<div class="timeline-panel">

    <div class="timeline-main">

        <button
            id="previous-time"
            class="time-button"
            type="button">
            ◀
        </button>

        <button
            id="play-time"
            class="time-button"
            type="button">
            ▶
        </button>

        <div class="time-slider-wrapper">

            <input
                type="range"
                id="time-slider"
                min="0"
                max="39"
                step="1"
                value="0"
            >

            <div class="time-info">

                <span id="valid-time-label">
                    —
                </span>

                <span id="lead-time-label">
                    —
                </span>

            </div>

        </div>

        <button
            id="next-time"
            class="time-button"
            type="button">
            ▶
        </button>

    </div>

</div>


<!-- MeteoRisk M1.1.4 active-view indicator -->
<div
    id="active-view-banner"
    class="mr-active-view-banner"
    role="status"
    aria-live="polite">
    <span class="mr-active-view-icon" aria-hidden="true">⚠</span>
    <div class="mr-active-view-copy">
        <div id="active-view-title" class="mr-active-view-title">УКУПАН РИЗИК</div>
        <div id="active-view-description" class="mr-active-view-description">
            Приказује највиши ризик од свих доступних опасности.
        </div>
    </div>
</div>


<div id="map"></div>


<div
    id="disclaimer"
    class="disclaimer">
</div>


<div
    id="status-message"
    class="status-message">
</div>


<div
    id="share-panel"
    class="share-panel">

    <button type="button" id="share-native">
        📱 Share
    </button>

    <button type="button" id="share-whatsapp">
        WhatsApp
    </button>

    <button type="button" id="share-viber">
        Viber
    </button>

    <button type="button" id="share-telegram">
        Telegram
    </button>

    <button type="button" id="share-email">
        Email
    </button>

</div>


<div id="mobile-detail-panel" class="mobile-detail-panel" aria-hidden="true">
    <div class="mobile-detail-header">
        <h2 id="mobile-detail-heading" class="mobile-detail-heading"></h2>
        <button id="mobile-detail-close" class="mobile-detail-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="mobile-detail-body" class="mobile-detail-body"></div>
</div>

<div id="overview-panel" class="overview-panel" aria-hidden="true">
    <div class="overview-header">
        <div>
            <h2 id="overview-title" class="overview-title"></h2>
            <div id="overview-subtitle" class="overview-subtitle"></div>
        </div>
        <button id="overview-close" class="overview-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="overview-body" class="overview-body"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<script src="js/country_registry.js"></script>
<script src="js/public_product_registry.js"></script>
<script src="js/config.js"></script>
<script src="js/hazards/temperature.js"></script>
<script src="js/hazards/fire.js?v=overview-fast-20260827-1"></script>
<script src="js/hazards/environment.js?v=overview-grouped-20260827-1"></script>
<script src="js/hazards/wind.js"></script>
<script src="js/app.js?v=storm-spatial-wording-20260827-1"></script>
<script src="js/ui_polish.js"></script>
<script src="js/popup_uniform.js?v=stormv2-timeline-20260826-2"></script>
</body>
</html>
